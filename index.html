function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function tryUnlock(pw){
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},k,u8(CT));
    try{localStorage.setItem('kellyVE.gate',pw)}catch(e){}
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
    return true;
  }catch(e){return false}
}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var ok=await tryUnlock(document.getElementById('pw').value.trim());
  if(!ok)document.getElementById('err').style.display='block';
});
(async function(){try{var s=localStorage.getItem('kellyVE.gate');if(s)await tryUnlock(s)}catch(e){}})();
</script>
